# Legacy Hyprland 0.53 / 0.54 only. Use hyprland.lua for 0.55+.
# Change GestC to an absolute build/GestC path when running from source.
bind = SUPER SHIFT, F9, exec, GestC --toggle-pause
bind = SUPER SHIFT, F10, exec, GestC --stop
bindm = SUPER, mouse:272, movewindow
windowrule = no_blur off, match:class ^(handmouse)$
windowrule = opaque off, match:class ^(handmouse)$
windowrule = force_rgbx off, match:class ^(handmouse)$
windowrule = rounding 22, match:class ^(handmouse)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(handmouse)$
